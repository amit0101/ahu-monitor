services:
  - type: web
    name: ahu-monitor-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SIM_AUTO_PLAY
        value: "true"
      - key: SIM_START_DAY
        value: "25"
